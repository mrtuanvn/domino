<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Domino Online</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="lobby-view" class="view">
  <div class="card">
    <h1>Domino Online</h1>
    <p class="sub">Chơi 4 người (có thể ghép Bot) - kiểu Miền Nam, 28 quân.</p>

    <form id="create-form">
      <label>Kiểu chơi</label>
      <div class="radio-row">
        <label><input type="radio" name="mode" value="block" checked /> Kiểu chặn (ăn thua từng ván)</label>
        <label><input type="radio" name="mode" value="score" /> Kiểu tính điểm (cộng dồn)</label>
      </div>

      <div id="matchWins-field" class="field">
        <label for="matchWins">Số ván thắng để thắng chung cuộc</label>
        <input type="number" id="matchWins" value="3" min="1" max="20" />
      </div>

      <div id="targetScore-field" class="field" style="display:none">
        <label for="targetScore">Điểm để thắng chung cuộc</label>
        <input type="number" id="targetScore" value="100" min="10" max="1000" />
      </div>

      <button type="submit">Tạo phòng mới</button>
    </form>
  </div>
</div>

<div id="room-view" class="view" style="display:none">
  <header class="room-header">
    <span id="room-code-mini">Phòng: <span id="room-code"></span></span>
    <button id="settings-btn" class="icon-btn" title="Tùy chọn">⚙️</button>
  </header>

  <div id="settings-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <strong>Tùy chọn</strong>
        <button id="settings-close-btn" class="icon-btn">✕</button>
      </div>
      <div class="modal-row">
        <strong>Phòng: <span id="room-code-2"></span></strong>
        <button id="copy-link-btn" class="small-btn">Sao chép link mời</button>
      </div>
      <div class="modal-row">
        <span>Âm thanh</span>
        <button id="sound-toggle" class="small-btn" title="Bật/tắt âm thanh">🔊</button>
      </div>
      <div class="modal-row modal-row-column">
        <span>Tỷ số</span>
        <div id="scoreboard" class="scoreboard"></div>
      </div>
    </div>
  </div>

  <section id="seats" class="seats"></section>

  <div id="lobby-actions" class="lobby-actions" style="display:none">
    <button id="start-btn">Bắt đầu (ghế trống sẽ được Bot thay)</button>
  </div>

  <section id="board-area" class="board-area" style="display:none">
    <div id="opponents-row" class="opponents-row"></div>

    <div class="table-panel-wrap">
      <div id="table-oval" class="table-oval">
        <div id="board" class="board"></div>
      </div>

      <div id="result-overlay" class="result-overlay" style="display:none">
        <div class="result-box">
          <p id="result-text"></p>
          <button id="rematch-btn" style="display:none">Chơi lại</button>
        </div>
      </div>
    </div>

    <div id="turn-indicator" class="turn-indicator"></div>

    <div id="hand-area" class="hand-area">
      <div id="your-seat-chip" class="your-seat-chip"></div>
      <div id="hand" class="hand"></div>
      <button id="pass-btn" style="display:none">Bỏ lượt</button>
      <div id="side-choice-popup" class="side-choice-popup" style="display:none">
        <button id="side-choice-left">A</button>
        <button id="side-choice-right">B</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" style="display:none"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/client.js"></script>
</body>
</html>
